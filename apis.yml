name: Vital
description: 'Vital is a patient-experience technology company for healthcare providers, delivering
  AI-powered patient guidance and communication across the hospital journey: emergency, inpatient,
  urgent care, patient access, care coordination, and post-discharge monitoring (Vital Guard). Its
  software integrates directly with electronic health record systems (Epic, Oracle Health/Cerner,
  MEDITECH, Veradigm) over FHIR R4 and HL7v2/ADT feeds to surface real-time wait-time predictions,
  plain-language test-result and discharge-instruction explanations, and AI medical translation.
  Vital is HIPAA compliant and HITRUST CSF, SOC 2, and NIST CSF aligned. The vitaler.com domain
  redirects to vital.io; Vital was surfaced as a portfolio company of Threshold Ventures. It exposes
  EHR/integration surfaces to its hospital customers rather than a public developer API.'
